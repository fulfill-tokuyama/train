.line-btn {

/* ===== Station Search ===== */
.search-btn-top{
  display:inline-block;background:#3A7BE8;color:white;text-decoration:none;

  line-height:1.6;border:none;cursor:pointer;font-family:inherit;
  vertical-align:top;
}
.search-overlay{
  display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;
  background:rgba(0,0,0,0.4);
  -webkit-justify-content:center;justify-content:center;
  -webkit-align-items:flex-start;align-items:flex-start;
  padding-top:15vh;
}
.search-overlay.show{
  display:-webkit-flex;display:flex;
}
.search-modal{

}

.search-modal-results{

.search-modal-item{
  display:-webkit-flex;display:flex;
  -webkit-align-items:center;align-items:center;

  font-size:14px;font-weight:700;color:#2C1810;
}
.search-modal-item:hover,.search-modal-item:active{background:#EEF2FF;}
.search-modal-item .sm-line{
  font-size:10px;color:#888;font-weight:500;white-space:nowrap;
}
.search-modal-item .sm-reading{font-size:12px;color:#888;font-weight:500;margin-left:auto;}
.search-modal-item .sm-dot{
  width:10px;height:10px;border-radius:50%;flex-shrink:0;-webkit-flex-shrink:0;
}
.search-modal-close{
  display:block;margin:12px auto 0;background:#eee;border:none;border-radius:10px;
  padding:8px 24px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:#666;
}

/* ===== Route Map ===== */
.routemap-header {
display: -webkit-flex; display: flex;
-webkit-align-items: center; align-items: center;
-webkit-justify-content: space-between; justify-content: space-between;

box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.routemap-badge {

color: white; font-weight: 700; font-size: 13px; line-height: 1.6;
}
.routemap-badge rt { font-size: 0.5em; color: rgba(255,255,255,0.8); }
.routemap-info {

}
.routemap-info .info-count { font-weight: 900; font-size: 20px; color: #E85D3A; }
.route-list {

.route-station {
display: -webkit-flex; display: flex;
-webkit-align-items: center; align-items: center;
gap: 14px; padding: 6px 0;
}
.route-line-col {
width: 32px;
display: -webkit-flex; display: flex;

}

.route-station-name.terminal-name { font-size: 20px; }
.terminal-tag {

padding: 2px 8px; border-radius: 8px; color: white;
margin-left: 6px; vertical-align: middle; line-height: 1.6;
}
.terminal-tag rt { font-size: 0.55em; color: rgba(255,255,255,0.85); }
.loop-tag {
display: inline-block; font-size: 10px; font-weight: 700;
padding: 2px 8px; border-radius: 8px; color: white;
background: #999; margin-left: 6px; vertical-align: middle;
}
.station-number { font-size: 11px; color: #BBB; font-weight: 700; min-width: 22px; text-align: right; -webkit-flex-shrink: 0; flex-shrink: 0; }

/* ===== Quiz ===== */
.quiz-header {
display: -webkit-flex; display: flex;
-webkit-align-items: center; align-items: center;
-webkit-justify-content: space-between; justify-content: space-between;

background: white; border-radius: 16px;

}

.line-badge {
display: inline-block; padding: 4px 12px; border-radius: 20px;
color: white; font-weight: 700; font-size: 12px; line-height: 1.6;
}
.line-badge rt { font-size: 0.5em; color: rgba(255,255,255,0.8); }
.score-display { font-size: 18px; font-weight: 700; color: #FFD700; }

.progress-label { font-size: 13px; color: #888; margin-bottom: 10px; text-align: center; line-height: 1.6; }

/* Station Flow Card */
.flow-card {
background: white; border-radius: 24px; padding: 20px 16px;
margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.flow-title {
text-align: center; font-size: 14px; color: #999; margin-bottom: 14px; line-height: 1.6;
}
.flow-stations {
display: -webkit-flex; display: flex;
-webkit-flex-direction: column; flex-direction: column;
-webkit-align-items: center; align-items: center;
gap: 0;
}
.flow-item {
text-align: center; padding: 8px 0; width: 100%;
}
.flow-station-name {
font-size: 22px; font-weight: 900; color: #2C1810; line-height: 1.5;
}
.flow-station-name rt { font-size: 0.45em; color: #999; }
.flow-arrow {
font-size: 20px; color: #CCC; padding: 2px 0; display: block; text-align: center;
}
.flow-blank {
display: inline-block;
border: 4px dashed #E85D3A;
border-radius: 16px;
padding: 8px 32px;
font-size: 28px; font-weight: 900;
color: #E85D3A;

}
.flow-blank.revealed-correct {
border-color: #4CAF50; background: #E8F5E9; color: #4CAF50;

}
.flow-blank.revealed-correct rt { color: #81C784; }
.flow-blank.revealed-wrong {
border-color: #FF6B6B; background: #FFEBEE; color: #FF6B6B;

}
.flow-correct-show {
display: block; font-size: 18px; font-weight: 700; color: #4CAF50;
margin-top: 4px;
}
.flow-correct-show rt { color: #81C784; }

/* Answer Buttons - 2 choices */
.answers-2 {
display: -webkit-flex; display: flex;
gap: 12px; margin-bottom: 14px;
}
.answer-btn-2 {
-webkit-flex: 1; flex: 1;
border: none; border-radius: 20px; padding: 18px 10px;
font-family: inherit; font-size: 22px; font-weight: 900;
color: #2C1810; background: white; cursor: pointer;
box-shadow: 0 5px 0 #D0D0D0, 0 5px 15px rgba(0,0,0,0.1);
min-height: 80px; line-height: 1.5; text-align: center;
-webkit-transition: all 0.15s ease; transition: all 0.15s ease;
}
.answer-btn-2 rt { font-size: 0.45em; color: #999; }
.answer-btn-2.correct {
background: #4CAF50; color: white;
box-shadow: 0 5px 0 #388E3C, 0 5px 15px rgba(76,175,80,0.3);
}
.answer-btn-2.correct rt { color: rgba(255,255,255,0.75); }
.answer-btn-2.wrong {
background: #FF6B6B; color: white;
box-shadow: 0 5px 0 #D32F2F, 0 5px 15px rgba(255,107,107,0.3);
}
.answer-btn-2.wrong rt { color: rgba(255,255,255,0.75); }
.answer-btn-2.disabled { opacity: 0.6; }

.choose-label {
text-align: center; font-size: 18px; font-weight: 900; color: #E85D3A;
margin-bottom: 12px; line-height: 1.6;
}

/* Feedback */
.feedback-overlay {
position: fixed; top: 0; left: 0; right: 0; bottom: 0;
display: -webkit-flex; display: flex;
-webkit-align-items: center; align-items: center;
-webkit-justify-content: center; justify-content: center;
z-index: 100; pointer-events: none; opacity: 0;
-webkit-transition: opacity 0.3s ease; transition: opacity 0.3s ease;
}
.feedback-overlay.show { opacity: 1; }
.feedback-text { font-size: 80px; font-weight: 900; }

/* Result */
.result-screen {
display: -webkit-flex; display: flex;
-webkit-flex-direction: column; flex-direction: column;
-webkit-align-items: center; align-items: center;
-webkit-justify-content: center; justify-content: center;

.result-emoji { font-size: 80px; margin-bottom: 12px; }
.result-title { font-size: 30px; font-weight: 900; color: #2C1810; margin-bottom: 8px; }
.result-score { font-size: 48px; font-weight: 900; color: #FFD700; margin-bottom: 4px; }
.result-detail { font-size: 16px; color: #888; margin-bottom: 20px; line-height: 1.6; }
.result-stars { font-size: 40px; margin-bottom: 20px; letter-spacing: 8px; }

.retry-btn, .home-btn {

.home-btn { background: #0068B7; }

.hidden { display: none !important; }

@media (max-width: 400px) {
.title-main { font-size: 28px; }
.flow-station-name { font-size: 19px; }
.flow-blank { font-size: 22px; padding: 6px 20px; }
.answer-btn-2 { font-size: 19px; padding: 14px 8px; min-height: 70px; }
.line-btn { min-width: 85px; }
}
</style>

// Audio
var audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
}
function playSound(freqs, type, vol, dur) {
  if (!audioCtx) return;
  try {
    for (var i = 0; i < freqs.length; i++) {
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type = type || 'sine';
      o.frequency.value = freqs[i][0];
      g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime + (freqs[i][1] || 0));
      g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (freqs[i][1] || 0) + (dur || 0.3));
      o.start(audioCtx.currentTime + (freqs[i][1] || 0));
      o.stop(audioCtx.currentTime + (freqs[i][1] || 0) + (dur || 0.3));
    }
  } catch(e) {}
}
function playCorrectSound() { playSound([[523,0],[659,0.1],[784,0.2]], 'sine', 0.3, 0.3); }
function playWrongSound() { playSound([[200,0],[150,0.15]], 'sawtooth', 0.15, 0.25); }

function buildTitleScreen() {
  var c = document.getElementById('lineSelect');
  c.innerHTML = '';

  for (var g = 0; g < GROUPS.length; g++) {
    (function(group) {
      var groupLines = [];
      for (var i = 0; i < LINES.length; i++) {
        if (LINES[i].group === group.id) groupLines.push(LINES[i]);
      }
      if (groupLines.length === 0) return;

      var wrap = document.createElement('div');
      wrap.className = 'company-group';

      var header = document.createElement('button');
      header.className = 'company-header';
      header.style.background = group.color;
      header.innerHTML = group.label + '<span class="company-arrow open">▶</span>';

      var linesDiv = document.createElement('div');
      linesDiv.className = 'company-lines';

      header.onclick = function() {
        var arrow = header.querySelector('.company-arrow');

          arrow.className = 'company-arrow';
        } else {
          linesDiv.className = 'company-lines';
          arrow.className = 'company-arrow open';
        }
      };

      for (var j = 0; j < groupLines.length; j++) {
        (function(line) {
          var btn = document.createElement('button');

          btn.onclick = function() {
            if (currentMode === 'quiz') startQuiz(line); else showRouteMap(line);
          };

        })(groupLines[j]);
      }

      wrap.appendChild(header);
      wrap.appendChild(linesDiv);

    })(GROUPS[g]);
  }
}

function stationRuby(st) {
  return '<ruby>' + st[0] + '<rt>' + st[1] + '</rt></ruby>';
}

function getUnique(line) {
  return line.isLoop ? line.stations.slice(0, -1) : line.stations;
}

// ===== ROUTE MAP =====
function showRouteMap(line) {
  currentLine = line;
  var badge = document.getElementById('routemapBadge');
  badge.innerHTML = line.nameHtml;
  badge.style.background = line.color;

  var isLoop = !!line.isLoop;
  var ds = isLoop ? line.stations.slice(0,-1) : line.stations;
  var count = ds.length;

  var info = document.getElementById('routemapInfo');
  if (isLoop) {
    info.innerHTML = line.companyHtml + ' ／ ' + line.nameHtml + '<br>' +
      '<span class="info-count">' + count + '</span> ' + R('駅','えき') + '　🔄 ' + R('環状','かんじょう');
  } else {
    info.innerHTML = line.companyHtml + ' ／ ' + line.nameHtml + '<br>' +
      '<span class="info-count">' + count + '</span> ' + R('駅','えき') + '　' +
      stationRuby(ds[0]) + ' ↔ ' + stationRuby(ds[count-1]);
  }

  var list = document.getElementById('routeList');
  list.innerHTML = '';
  for (var i = 0; i < count; i++) {
    var isFirst = (i === 0), isLast = (i === count-1), isTerm = isFirst || isLast;
    var row = document.createElement('div');
    row.className = 'route-station';

    var num = document.createElement('div');
    num.className = 'station-number';
    num.textContent = (i+1)+'';
    row.appendChild(num);

    var col = document.createElement('div');
    col.className = 'route-line-col';
    if (!isFirst) { var tc = document.createElement('div'); tc.className='route-connector'; tc.style.background=line.color; col.appendChild(tc); }
    var dot = document.createElement('div');
    dot.className = 'route-dot' + (isTerm ? ' terminal' : '');
    dot.style.borderColor = line.color; dot.style.color = line.color;
    if (isTerm) dot.style.background = line.color;
    col.appendChild(dot);
    if (!isLast) { var bc = document.createElement('div'); bc.className='route-connector'; bc.style.background=line.color; col.appendChild(bc); }
    row.appendChild(col);

    var nm = document.createElement('div');
    nm.className = 'route-station-name' + (isTerm ? ' terminal-name' : '');
    var h = stationRuby(ds[i]);
    if (isLoop) {
      if (isFirst) h += '<span class="terminal-tag" style="background:'+line.color+';">'+R('始発','しはつ')+'</span>';
      if (isLast) h += '<span class="loop-tag">→ '+R('大阪','おおさか')+'へ</span>';
    } else {
      if (isFirst) h += '<span class="terminal-tag" style="background:'+line.color+';">'+R('始発','しはつ')+'</span>';
      if (isLast) h += '<span class="terminal-tag" style="background:'+line.color+';">'+R('終着','しゅうちゃく')+'</span>';
    }
    nm.innerHTML = h;
    row.appendChild(nm);
    list.appendChild(row);
  }
  showScreen('routemapScreen');
}

// ===== QUIZ (Fill-in-the-blank) =====
function startQuiz(line) {
  ensureAudio();
  currentLine = line;
  score = 0;
  questionIndex = 0;

  var u = getUnique(line);
  // Generate questions: pick random contiguous segments, blank one station in the middle
  quizSegments = [];
  var numQ = Math.min(QUIZ_LENGTH, u.length - 2); // need at least 3 stations for context

  var usedBlanks = {};
  var attempts = 0;
  while (quizSegments.length < numQ && attempts < 200) {
    attempts++;
    // Window size: 3-5 stations shown
    var winSize = Math.min(3 + Math.floor(Math.random() * 3), u.length); // 3,4,5
    if (winSize < 3) winSize = 3;
    var maxStart = u.length - winSize;
    var start = Math.floor(Math.random() * (maxStart + 1));

    // Pick blank position (not first or last in window)
    var blankPos = 1 + Math.floor(Math.random() * (winSize - 2));
    var blankAbsIdx = start + blankPos;

    // Avoid duplicates
    if (usedBlanks[blankAbsIdx]) continue;
    usedBlanks[blankAbsIdx] = true;

    var segment = u.slice(start, start + winSize);
    quizSegments.push({
      stations: segment,
      blankPos: blankPos,
      correct: segment[blankPos]
    });
  }

  totalQuestions = quizSegments.length;
  document.getElementById('lineBadge').innerHTML = line.nameHtml;
  document.getElementById('lineBadge').style.background = line.color;
  document.getElementById('scoreDisplay').textContent = '⭐ 0';

  showScreen('quizScreen');
  showQuestion();
}

function showQuestion() {
  if (questionIndex >= totalQuestions) { showResult(); return; }
  answerLocked = false;

  document.getElementById('progressLabel').innerHTML =
    (questionIndex+1) + ' / ' + totalQuestions + ' ' + R('問目','もんめ');

  var seg = quizSegments[questionIndex];
  var flowCard = document.getElementById('flowCard');
  var html = '<div class="flow-title">' + R('駅','えき') + 'の' + R('順番','じゅんばん') + ' 🚃</div>';
  html += '<div class="flow-stations">';

  for (var i = 0; i < seg.stations.length; i++) {
    if (i > 0) html += '<div class="flow-arrow">▼</div>';
    if (i === seg.blankPos) {
      html += '<div class="flow-item"><div class="flow-blank" id="blankSlot">❓</div></div>';
    } else {
      html += '<div class="flow-item"><div class="flow-station-name">' + stationRuby(seg.stations[i]) + '</div></div>';
    }
  }

  html += '</div>';
  flowCard.innerHTML = html;

  // Generate 2 choices: correct + 1 wrong
  var wrong = pickWrongStation(seg.correct);
  var choices = [seg.correct, wrong];
  // Shuffle
  if (Math.random() > 0.5) { var t = choices[0]; choices[0] = choices[1]; choices[1] = t; }

  var ad = document.getElementById('answers');
  ad.innerHTML = '';
  for (var j = 0; j < choices.length; j++) {
    (function(ch) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn-2';
      btn.innerHTML = stationRuby(ch);
      btn.setAttribute('data-key', ch[0]);
      btn.onclick = function() { handleAnswer(btn, ch); };
      ad.appendChild(btn);
    })(choices[j]);
  }
}

function pickWrongStation(correct) {
  var all = getUnique(currentLine);
  var attempts = 0;
  while (attempts < 100) {
    var r = all[Math.floor(Math.random() * all.length)];
    if (r[0] !== correct[0]) return r;
    attempts++;
  }
  return all[0]; // fallback
}

function handleAnswer(btn, chosen) {
  if (answerLocked) return;
  answerLocked = true;

  var seg = quizSegments[questionIndex];
  var correct = seg.correct;
  var btns = document.querySelectorAll('.answer-btn-2');
  var blank = document.getElementById('blankSlot');

  if (chosen[0] === correct[0]) {
    btn.className += ' correct';
    score++;
    document.getElementById('scoreDisplay').textContent = '⭐ ' + score;
    playCorrectSound();
    showFeedback('🎊');
    // Fill in blank with correct answer
    blank.className = 'flow-blank revealed-correct';
    blank.innerHTML = stationRuby(correct);
  } else {
    btn.className += ' wrong';
    playWrongSound();
    showFeedback('😢');
    // Show what they picked (wrong) then show correct
    blank.className = 'flow-blank revealed-wrong';
    blank.innerHTML = stationRuby(chosen);
    // Show correct below
    var correctShow = document.createElement('div');
    correctShow.className = 'flow-correct-show';
    correctShow.innerHTML = '→ ' + stationRuby(correct);
    blank.parentNode.appendChild(correctShow);
    // Also highlight correct button
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-key') === correct[0]) {
        btns[i].className += ' correct';
      }
    }
  }

  for (var k = 0; k < btns.length; k++) {
    btns[k].className += ' disabled';
  }

  setTimeout(function() { questionIndex++; showQuestion(); }, 1800);
}

function showFeedback(emoji) {
  var ov = document.getElementById('feedbackOverlay');
  document.getElementById('feedbackText').textContent = emoji;
  ov.className = 'feedback-overlay show';
  setTimeout(function() { ov.className = 'feedback-overlay'; }, 1000);
}

function showResult() {
  playResultSound();
  showScreen('resultScreen');
  var pct = totalQuestions > 0 ? score / totalQuestions : 0;
  var emoji, title;
  if (pct === 1) { emoji = '🏆'; title = 'パーフェクト！！'; }
  else if (pct >= 0.8) { emoji = '🎉'; title = 'すごーい！'; }
  else if (pct >= 0.5) { emoji = '😊'; title = 'がんばったね！'; }
  else { emoji = '💪'; title = 'つぎはがんばろう！'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = score + ' / ' + totalQuestions;
  document.getElementById('resultDetail').innerHTML = currentLine.nameHtml + ' クイズ';
  var stars = pct === 1 ? 3 : pct >= 0.7 ? 2 : pct >= 0.4 ? 1 : 0;
  var s = '';
  for (var i = 0; i < 3; i++) s += (i < stars ? '⭐' : '☆');
  document.getElementById('resultStars').textContent = s;
}

document.getElementById('retryBtn').onclick = function() { startQuiz(currentLine); };
document.getElementById('homeBtn').onclick = function() { showScreen('titleScreen'); };

buildTitleScreen();

// ===== Station Search =====
function toHiragana(str){
  return str.replace(/[\u30A1-\u30F6]/g,function(c){
    return String.fromCharCode(c.charCodeAt(0)-0x60);
  });
}

function getAllStations(){
  var map={};
  for(var i=0;i<LINES.length;i++){
    var ln=LINES[i];
    for(var j=0;j<ln.stations.length;j++){
      var name=ln.stations[j][0];
      var reading=ln.stations[j][1];
      if(!map[name]){
        map[name]={name:name,reading:reading,lines:[],colors:[]};
      }
      var lineName=ln.nameHtml.replace(/<ruby>|<\/ruby>|<rt>.*?<\/rt>/g,'');
      if(map[name].lines.indexOf(lineName)<0){
        map[name].lines.push(lineName);
        map[name].colors.push(ln.color);
      }
    }
  }
  var arr=[];
  for(var k in map) arr.push(map[k]);
  return arr;
}

var allStations=getAllStations();

function searchStationsTop(query){
  if(!query) return [];
  var q=toHiragana(query.toLowerCase());
  var results=[];
  for(var i=0;i<allStations.length;i++){
    var s=allStations[i];
    var nameMatch=s.name.indexOf(query)>=0;
    var readingMatch=s.reading&&toHiragana(s.reading).indexOf(q)>=0;
    if(nameMatch||readingMatch){
      results.push(s);
    }
  }
  return results.slice(0,30);
}

function findLinesForStation(stationName){
  var found=[];
  for(var i=0;i<LINES.length;i++){
    for(var j=0;j<LINES[i].stations.length;j++){
      if(LINES[i].stations[j][0]===stationName){
        found.push(LINES[i]);
        break;
      }
    }
  }
  return found;
}

function renderSearchResults(results){
  var box=document.getElementById('stationSearchResults');
  if(results.length===0){
    box.innerHTML='<div class="search-modal-noresult">みつかりません</div>';
    return;
  }
  var html='';
  for(var i=0;i<results.length;i++){
    var s=results[i];
    html+='<div class="search-modal-item" data-name="'+s.name+'">';
    html+='<span class="sm-dot" style="background:'+s.colors[0]+';"></span>';
    html+='<span>'+s.name+'</span>';
    html+='<span class="sm-line">'+s.lines.join(', ')+'</span>';
    html+='<span class="sm-reading">'+s.reading+'</span>';
    html+='</div>';
  }
  box.innerHTML=html;
  var items=box.querySelectorAll('.search-modal-item');
  for(var j=0;j<items.length;j++){
    items[j].addEventListener('click',function(){
      var name=this.getAttribute('data-name');
      var lines=findLinesForStation(name);
      if(lines.length===1){
        closeStationSearch();
        showRouteMap(lines[0]);
      } else {
        showLineChoices(name,lines);
      }
    });
  }
}

function showLineChoices(stationName,lines){
  var box=document.getElementById('stationSearchResults');
  var html='<div style="padding:8px 0;font-size:13px;font-weight:900;color:#2C1810;text-align:center;">「'+stationName+'」の<ruby>路線<rt>ろせん</rt></ruby>をえらんでね</div>';
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    var lineName=ln.nameHtml.replace(/<ruby>|<\/ruby>|<rt>.*?<\/rt>/g,'');
    html+='<div class="search-modal-item" data-line-idx="'+i+'">';
    html+='<span class="sm-dot" style="background:'+ln.color+';"></span>';
    html+='<span>'+lineName+'</span>';
    html+='</div>';
  }
  box.innerHTML=html;
  var items=box.querySelectorAll('.search-modal-item');
  for(var j=0;j<items.length;j++){
    (function(idx){
      items[idx].addEventListener('click',function(){
        closeStationSearch();
        showRouteMap(lines[idx]);
      });
    })(j);
  }
}

function openStationSearch(){
  document.getElementById('searchOverlay').className='search-overlay show';
  var inp=document.getElementById('stationSearchInput');
  inp.value='';
  document.getElementById('stationSearchResults').innerHTML='';
  setTimeout(function(){inp.focus();},100);
}

function closeStationSearch(){
  document.getElementById('searchOverlay').className='search-overlay';
}

function closeSearchOverlay(e){
  if(e.target===document.getElementById('searchOverlay')) closeStationSearch();
}

var isComposingTop=false;
var searchInpTop=document.getElementById('stationSearchInput');

function doSearchTop(){
  var q=searchInpTop.value.trim();
  var box=document.getElementById('stationSearchResults');
  if(!q){box.innerHTML='';return;}
  renderSearchResults(searchStationsTop(q));
}

searchInpTop.addEventListener('compositionstart',function(){isComposingTop=true;});
searchInpTop.addEventListener('compositionend',function(){isComposingTop=false;doSearchTop();});
searchInpTop.addEventListener('input',function(){if(!isComposingTop)doSearchTop();});
