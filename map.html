<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;background:#F0F4F8;}
ruby{ruby-align:center;}
rt{font-size:0.55em;font-weight:700;color:#888;}

.top-bar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;background:rgba(255,255,255,0.95);
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.top-bar h1{font-size:16px;font-weight:900;color:#2C1810;}
.top-bar a{
  text-decoration:none;background:#E85D3A;color:white;
  padding:6px 14px;border-radius:10px;font-size:13px;font-weight:700;
}

.legend-toggle{
  position:fixed;bottom:12px;right:12px;z-index:100;
  background:#E85D3A;color:white;border:none;border-radius:50%;
  width:44px;height:44px;font-size:20px;cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,0.2);
}
.legend-panel{
  position:fixed;bottom:66px;right:12px;z-index:100;
  background:rgba(255,255,255,0.97);border-radius:14px;
  padding:12px 14px;max-height:60vh;overflow-y:auto;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
  display:none;min-width:160px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.legend-panel.show{display:block;}
.legend-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;font-weight:700;cursor:pointer;}
.legend-item:active{opacity:0.6;}
.legend-color{width:24px;height:6px;border-radius:3px;flex-shrink:0;}
.legend-section{font-size:11px;color:#999;font-weight:900;margin-top:8px;margin-bottom:2px;padding-top:6px;border-top:1px solid #eee;}
.legend-section:first-child{border-top:none;margin-top:0;padding-top:0;}

.map-container{
  position:fixed;top:0;left:0;right:0;bottom:0;
  overflow:hidden;touch-action:none;cursor:grab;
}
.map-container:active{cursor:grabbing;}
.map-inner{
  transform-origin:0 0;
  will-change:transform;
}

svg text{pointer-events:none;user-select:none;-webkit-user-select:none;}
svg .line-path{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer;transition:opacity 0.3s;}
svg .line-path:hover{opacity:0.7;}
svg .station-dot{cursor:pointer;transition:r 0.2s;}
svg .station-dot:hover{r:7;}
svg .line-path.dimmed{opacity:0.1;}
svg .station-dot.dimmed{opacity:0.15;}
svg .station-label.dimmed{opacity:0.15;}

.hint{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:90;
  background:rgba(0,0,0,0.6);color:white;padding:6px 14px;border-radius:20px;
  font-size:12px;font-weight:700;pointer-events:none;
  transition:opacity 1s;
}
</style>
</head>

// ===== Render =====
var svgW=860,svgH=900;
var svg=document.getElementById('mapSvg');
svg.setAttribute('viewBox','0 0 '+svgW+' '+svgH);
svg.setAttribute('width',svgW);
svg.setAttribute('height',svgH);

var highlightGroup=null;

function pt(p){
  if(typeof p==='string') return STATIONS[p];
  return p;
}

function buildPath(pathArr){
  var d='';
  for(var i=0;i<pathArr.length;i++){
    var p=pt(pathArr[i]);
    d+=(i===0?'M':'L')+p.x+','+p.y+' ';
  }
  return d;
}

function renderMap(){
  var html='';
  for(var i=0;i<MAP_LINES.length;i++){
    var ln=MAP_LINES[i];
    var cls='line-path'+(highlightGroup&&ln.group!==highlightGroup?' dimmed':'');
    html+='<path class="'+cls+'" d="'+buildPath(ln.path)+'" stroke="'+ln.color+'" stroke-width="'+ln.w+'" data-group="'+ln.group+'" data-name="'+ln.name+'"/>';
    if(ln.loop){
      var last=pt(ln.path[ln.path.length-1]);
      var first=pt(ln.path[0]);
    }
  }

  var drawnStations={};
  for(var i=0;i<MAP_LINES.length;i++){
    var ln=MAP_LINES[i];
    for(var j=0;j<ln.path.length;j++){
      if(typeof ln.path[j]!=='string') continue;
      var sid=ln.path[j];
      if(drawnStations[sid]) continue;
      drawnStations[sid]=true;
      var s=STATIONS[sid];
      var r=s.major?5:3;
      var cls='station-dot'+(highlightGroup&&ln.group!==highlightGroup?' dimmed':'');
      html+='<circle class="'+cls+'" cx="'+s.x+'" cy="'+s.y+'" r="'+r+'" fill="white" stroke="#333" stroke-width="'+(s.major?2.5:1.5)+'"/>';
    }
  }

  for(var sid in drawnStations){
    var s=STATIONS[sid];
    if(!s.major&&!isJunction(sid)) continue;
    var cls='station-label'+(highlightGroup&&!isInGroup(sid,highlightGroup)?' dimmed':'');
    var fs=s.major?11:8.5;
    var fw=s.major?900:700;
    var dy=s.major?-10:-7;
    if(sid==='shin_osaka'||sid==='esaka'||sid==='dainichi'||sid==='kokusaikaikan'||sid==='sasayamaguchi'||sid==='seishin_chuo'||sid==='arashiyama'||sid==='himeji'||sid==='kitano_hakubaicho'||sid==='wadayama'||sid==='niimi'||sid==='osaka_airport'||sid==='saito_nishi'||sid==='senri_chuo'||sid==='banpaku')dy=-7;
    if(sid==='shin_kobe')dy=-6;
    if(sid==='kobe_sannomiya'){dy=-5;}
    if(sid==='nakamozu'||sid==='yao_minami'||sid==='suminoe_koen'||sid==='kyuhoji'||sid==='kadoma_minami'||sid==='wakayama'||sid==='hineno'||sid==='woody_town'||sid==='omi_shiotsu'||sid==='kobe_airport')dy=14;
    if(sid==='ao'||sid==='kinosaki'||sid==='amanohashidate'||sid==='miyazu'||sid==='kurama'||sid==='maibara'||sid==='taga')dy=-7;
    if(sid==='banshu_ako'||sid==='sanyo_aboshi'||sid==='shingu'||sid==='kushimoto'||sid==='shirahama'||sid==='gobo'||sid==='kishi'||sid==='kada'||sid==='gokurakubashi'||sid==='marine_park'||sid==='hojocho'||sid==='izumi_chuo'||sid==='mizuma_kannon'||sid==='hamadera'||sid==='kaizuka'||sid==='minoo_kayano')dy=14;
    if(sid==='kamigori')dy=14;
    if(sid==='chizu_st')dy=-7;
    html+='<text class="'+cls+'" x="'+s.x+'" y="'+(s.y+dy)+'" text-anchor="middle" font-size="'+fs+'" font-weight="'+fw+'" fill="#2C1810">'+s.n+'</text>';
  }

  svg.innerHTML=html;
  addLineClickHandlers();
}

function isJunction(sid){
  var count=0;
  for(var i=0;i<MAP_LINES.length;i++){
    for(var j=0;j<MAP_LINES[i].path.length;j++){
      if(MAP_LINES[i].path[j]===sid){count++;break;}
    }
  }
  return count>=2;
}

function isInGroup(sid,grp){
  for(var i=0;i<MAP_LINES.length;i++){
    if(MAP_LINES[i].group!==grp) continue;
    for(var j=0;j<MAP_LINES[i].path.length;j++){
      if(MAP_LINES[i].path[j]===sid) return true;
    }
  }
  return false;
}

function addLineClickHandlers(){
  var paths=svg.querySelectorAll('.line-path');
  for(var i=0;i<paths.length;i++){
    paths[i].addEventListener('click',function(e){
      var g=this.getAttribute('data-group');
      if(highlightGroup===g) highlightGroup=null;
      else highlightGroup=g;
      renderMap();
    });
  }
}

// ===== Legend =====
function buildLegend(){
  var panel=document.getElementById('legendPanel');
  var html='';
  var currentGroup='';
  for(var i=0;i<MAP_LINES.length;i++){
    var ln=MAP_LINES[i];
    var grp=null;
    for(var g=0;g<GROUPS.length;g++){if(GROUPS[g].id===ln.group){grp=GROUPS[g];break;}}
    if(grp&&grp.label!==currentGroup){
      currentGroup=grp.label;
      html+='<div class="legend-section">'+grp.label+'</div>';
    }
    html+='<div class="legend-item" data-group="'+ln.group+'">';
    html+='<div class="legend-color" style="background:'+ln.color+'"></div>';
    html+='<span>'+ln.name+'</span></div>';
  }
  panel.innerHTML=html;

  var items=panel.querySelectorAll('.legend-item');
  for(var i=0;i<items.length;i++){
    items[i].addEventListener('click',function(){
      var g=this.getAttribute('data-group');
      if(highlightGroup===g) highlightGroup=null;
      else highlightGroup=g;
      renderMap();
    });
  }
}

function toggleLegend(){
  var p=document.getElementById('legendPanel');
  p.className=p.className.indexOf('show')>=0?'legend-panel':'legend-panel show';
}

// ===== Pan & Zoom =====
var scale=1,panX=0,panY=0;
var isDragging=false,startX,startY,lastPanX,lastPanY;
var initialDist=0,initialScale=1;
var container=document.getElementById('mapContainer');
var inner=document.getElementById('mapInner');

function updateTransform(){
  inner.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';
}

function fitMap(){
  var cw=window.innerWidth, ch=window.innerHeight;
  var sx=cw/svgW, sy=ch/svgH;
  scale=Math.min(sx,sy)*0.92;
  panX=(cw-svgW*scale)/2;
  panY=(ch-svgH*scale)/2+20;
  updateTransform();
}

container.addEventListener('mousedown',function(e){
  isDragging=true;startX=e.clientX;startY=e.clientY;
  lastPanX=panX;lastPanY=panY;
});
window.addEventListener('mousemove',function(e){
  if(!isDragging)return;
  panX=lastPanX+(e.clientX-startX);
  panY=lastPanY+(e.clientY-startY);
  updateTransform();
});
window.addEventListener('mouseup',function(){isDragging=false;});

container.addEventListener('wheel',function(e){
  e.preventDefault();
  var d=e.deltaY>0?0.9:1.1;
  var rect=container.getBoundingClientRect();
  var mx=e.clientX-rect.left, my=e.clientY-rect.top;
  var newScale=Math.min(Math.max(scale*d,0.3),5);
  panX=mx-(mx-panX)*(newScale/scale);
  panY=my-(my-panY)*(newScale/scale);
  scale=newScale;
  updateTransform();
},{passive:false});

var touches=[];
container.addEventListener('touchstart',function(e){
  touches=e.touches;
  if(touches.length===1){
    isDragging=true;startX=touches[0].clientX;startY=touches[0].clientY;
    lastPanX=panX;lastPanY=panY;
  }else if(touches.length===2){
    isDragging=false;
    initialDist=Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);
    initialScale=scale;lastPanX=panX;lastPanY=panY;
    startX=(touches[0].clientX+touches[1].clientX)/2;
    startY=(touches[0].clientY+touches[1].clientY)/2;
  }
},{passive:true});
container.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(e.touches.length===1&&isDragging){
    panX=lastPanX+(e.touches[0].clientX-startX);
    panY=lastPanY+(e.touches[0].clientY-startY);
    updateTransform();
  }else if(e.touches.length===2){
    var dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    var newScale=Math.min(Math.max(initialScale*(dist/initialDist),0.3),5);
    var mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    var my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    panX=lastPanX+(mx-startX)+(mx-startX)*(newScale/initialScale-1)*0.3;
    panY=lastPanY+(my-startY)+(my-startY)*(newScale/initialScale-1)*0.3;
    panX=mx-(startX-lastPanX)*(newScale/initialScale);
    panY=my-(startY-lastPanY)*(newScale/initialScale);
    scale=newScale;
    updateTransform();
  }
},{passive:false});
container.addEventListener('touchend',function(e){
  if(e.touches.length===0)isDragging=false;
  touches=e.touches;
});

// ===== Init =====
renderMap();
buildLegend();
fitMap();
window.addEventListener('resize',fitMap);

setTimeout(function(){
  var h=document.getElementById('hint');
  h.style.opacity='0';
  setTimeout(function(){h.style.display='none';},1000);
},4000);
</script>
